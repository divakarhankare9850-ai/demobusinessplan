<!-- Design-system component layer -->
<style type="text/tailwindcss">
  @layer base {
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    body { @apply bg-canvas text-ink font-sans antialiased selection:bg-brand-50 selection:text-brand-dark; }
  }
  @layer components {
    .wrap { @apply max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8; }
    .btn { @apply inline-flex items-center justify-center gap-2 h-11 sm:h-10 px-5 sm:px-4 rounded-lg text-sm font-semibold whitespace-nowrap transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 disabled:opacity-50 active:scale-[0.98]; }
    .btn-lg { @apply h-12 px-6 text-[15px]; }
    .btn-sm { @apply h-9 px-3 text-[13px]; }
    .btn-primary { @apply bg-brand text-white hover:bg-brand-dark hover:shadow-md; }
    .btn-secondary { @apply bg-white text-ink border border-line hover:bg-canvas hover:border-gray-300; }
    .btn-tertiary { @apply text-ink hover:text-brand px-2 bg-transparent hover:bg-brand-50/50; }
    .btn-danger { @apply bg-danger text-white hover:bg-red-700; }
    .icon-btn { @apply inline-flex items-center justify-center w-11 h-11 sm:w-10 sm:h-10 rounded-lg text-ink hover:bg-canvas transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand active:scale-95; }
    .label { @apply block text-sm font-semibold text-ink mb-1.5; }
    .field { @apply w-full h-12 sm:h-11 rounded-lg border border-line bg-white px-3.5 text-sm text-ink placeholder:text-muted transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand; }
    textarea.field { @apply h-auto py-3 leading-relaxed resize-y; }
    .field[aria-invalid="true"] { @apply border-danger ring-2 ring-danger/20; }
    .chip { @apply inline-flex items-center h-10 sm:h-9 px-4 sm:px-3.5 rounded-full border border-line bg-white text-sm font-medium text-ink whitespace-nowrap transition-all duration-200 hover:border-ink hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand; }
    .chip[aria-pressed="true"] { @apply bg-brand border-brand text-white hover:border-brand hover:bg-brand-dark; }
    .card { @apply bg-white border border-line rounded-xl shadow-card transition-shadow duration-200; }
    .badge { @apply inline-flex items-center gap-1.5 h-6 px-2.5 rounded-md text-xs font-bold uppercase tracking-wider; }
    .filter-opt { @apply flex items-center justify-between w-full text-left text-sm px-3 py-2.5 rounded-lg text-ink hover:bg-canvas transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand; }
    .filter-opt[aria-pressed="true"] { @apply bg-brand-50 text-brand-dark font-semibold; }
    .section-title { @apply text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight text-ink; }
  }
</style>
<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .modal-in { animation: modalIn .25s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast-in { animation: toastIn .3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes modalIn { from { opacity: 0; transform: translateY(15px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .drawer-in { animation: drawerIn .3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes drawerIn { from { transform: translateX(-100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

<script>
/* =========================================================
   SurplusSetu — Application Logic
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Math.round(Number(n)).toLocaleString('en-IN');
const icons = () => { if (window.lucide) lucide.createIcons(); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

/* ---------- Constants ---------- */
const COMMISSION = 0.08;
const CATS = ['Tiles & Stone', 'Cement & Concrete', 'Steel & Rebar', 'Plumbing & Sanitary', 'Electrical', 'Wood & Boards', 'Paint & Finishes', 'Bricks & Blocks', 'Doors & Windows'];
const CAT_ART = { 'Tiles & Stone': 'Tiles', 'Cement & Concrete': 'Cement', 'Steel & Rebar': 'Steel', 'Plumbing & Sanitary': 'Plumbing', 'Electrical': 'Electrical', 'Wood & Boards': 'Wood', 'Paint & Finishes': 'Paint', 'Bricks & Blocks': 'Bricks', 'Doors & Windows': 'Doors' };
const CONDS = ['New, unused', 'New, open box', 'Used, good condition'];
const AREAS = ['Baner', 'Chakan', 'Hadapsar', 'Hinjewadi', 'Kharadi', 'Kothrud', 'Pimpri', 'Talegaon', 'Viman Nagar', 'Wakad'];
const UNITS = ['piece', 'sq ft', 'kg', 'bag', 'sheet', 'bucket', 'coil', 'set', 'length'];
const SHELF = ['Not applicable', 'Under 3 months', '3 to 6 months', '6 to 12 months', '12+ months'];
const PRICE_BUCKETS = [
  { id: 'any', label: 'Any lot value', test: () => true },
  { id: 'u20', label: 'Under ₹20,000', test: v => v < 20000 },
  { id: 'm50', label: '₹20,000 – ₹50,000', test: v => v >= 20000 && v < 50000 },
  { id: 'm100', label: '₹50,000 – ₹1,00,000', test: v => v >= 50000 && v < 100000 },
  { id: 'o100', label: 'Above ₹1,00,000', test: v => v >= 100000 }
];
const SORTS = [
  { id: 'relevance', label: 'Recommended' },
  { id: 'newest', label: 'Newest first' },
  { id: 'lotLow', label: 'Lot value: low to high' },
  { id: 'lotHigh', label: 'Lot value: high to low' },
  { id: 'savings', label: 'Highest savings' }
];
const STATUS = {
  reviewed: { label: 'Verified Listing', icon: 'shield-check', cls: 'bg-success-50 text-success' },
  declared: { label: 'Standard Listing', icon: 'check-circle', cls: 'bg-canvas text-muted border border-line' },
  pending: { label: 'Pending Review', icon: 'clock', cls: 'bg-warning-50 text-warning' }
};

/* ---------- Initial Data State ---------- */
const day = d => Date.now() - d * 864e5;
const SEED = [
  { id: 'p1', title: 'Vitrified floor tiles, 600×600 mm, matte ivory', cat: 'Tiles & Stone', price: 38, mrp: 62, unit: 'sq ft', qty: 420, cond: 'New, unused', shelf: 'Not applicable', area: 'Wakad', seller: 'Shree Interiors', status: 'reviewed', created: day(2), featured: 1, desc: 'Leftover from a completed 3 BHK fit-out. Eleven sealed boxes, same batch number. Pickup from the site store room; loading help available.' },
  { id: 'p2', title: 'PPC cement, 50 kg bags, sealed', cat: 'Cement & Concrete', price: 340, mrp: 395, unit: 'bag', qty: 60, cond: 'New, unused', shelf: '3 to 6 months', area: 'Hadapsar', seller: 'Patil Constructions', status: 'reviewed', created: day(1), featured: 1, desc: 'Stored indoors on pallets, off the floor. Bags are intact and dry. Best used within the shelf life shown.' },
  { id: 'p3', title: 'TMT Fe500 rebar, 12 mm, 12 m lengths', cat: 'Steel & Rebar', price: 58, mrp: 72, unit: 'kg', qty: 1800, cond: 'New, unused', shelf: 'Not applicable', area: 'Chakan', seller: 'Deshmukh Builders', status: 'declared', created: day(4), desc: 'Bought for a slab that was redesigned. Surface rust is light and typical of open storage. Mill test certificate can be shared on request.' },
  { id: 'p4', title: 'CPVC pipes, 1 inch, 3 m lengths', cat: 'Plumbing & Sanitary', price: 165, mrp: 240, unit: 'length', qty: 90, cond: 'New, unused', shelf: 'Not applicable', area: 'Kharadi', seller: 'Aarav Plumbing Works', status: 'declared', created: day(6), desc: 'Excess from a residential tower project. Includes no fittings. Pipes are stored under cover.' },
  { id: 'p5', title: 'FR copper wire, 2.5 sq mm, 90 m coils', cat: 'Electrical', price: 1650, mrp: 2150, unit: 'coil', qty: 14, cond: 'New, unused', shelf: 'Not applicable', area: 'Kharadi', seller: 'Joshi Electricals', status: 'reviewed', created: day(3), desc: 'Factory-sealed coils, mixed colours: red, black and green. Ideal for finishing or small contractor jobs.' },
  { id: 'p6', title: 'BWP plywood, 19 mm, 8×4 ft sheets', cat: 'Wood & Boards', price: 1480, mrp: 2050, unit: 'sheet', qty: 36, cond: 'New, open box', shelf: 'Not applicable', area: 'Hinjewadi', seller: 'Kale Furnishing', status: 'reviewed', created: day(1), featured: 1, desc: 'Stacked flat in a dry godown. A few sheets have minor edge marks from handling. Surfaces are clean.' },
  { id: 'p7', title: 'Exterior emulsion paint, 20 L, white', cat: 'Paint & Finishes', price: 3900, mrp: 5600, unit: 'bucket', qty: 11, cond: 'New, unused', shelf: '12+ months', area: 'Viman Nagar', seller: 'Nikam Paint Contractors', status: 'reviewed', created: day(5), featured: 1, desc: 'Sealed buckets from a cancelled facade job. Batch numbers visible on request. Storage has been indoors.' },
  { id: 'p8', title: 'Red clay bricks, first class', cat: 'Bricks & Blocks', price: 7.5, mrp: 10, unit: 'piece', qty: 6000, cond: 'New, unused', shelf: 'Not applicable', area: 'Talegaon', seller: 'Bhosale Site Supplies', status: 'declared', created: day(8), desc: 'Palletised, uncovered stock. Expect a small number of broken pieces. Buyer arranges transport.' },
  { id: 'p9', title: 'Black granite kitchen slabs, 8 ft', cat: 'Tiles & Stone', price: 9800, mrp: 14500, unit: 'piece', qty: 4, cond: 'Used, good condition', shelf: 'Not applicable', area: 'Kothrud', seller: 'Gokhale Renovations', status: 'declared', created: day(9), desc: 'Removed carefully during a kitchen remodel. Edges polished, one slab has a small chip near the corner (photographed).' },
  { id: 'p10', title: 'Modular switches and plates, assorted', cat: 'Electrical', price: 95, mrp: 160, unit: 'piece', qty: 240, cond: 'New, open box', shelf: 'Not applicable', area: 'Pimpri', seller: 'Joshi Electricals', status: 'declared', created: day(7), desc: 'Mix of 6A and 16A switches with white plates. Boxes opened for counting; all pieces are unused.' },
  { id: 'p11', title: 'Wall-hung WC sets with concealed cistern', cat: 'Plumbing & Sanitary', price: 5200, mrp: 8400, unit: 'set', qty: 8, cond: 'New, unused', shelf: 'Not applicable', area: 'Baner', seller: 'Aarav Plumbing Works', status: 'reviewed', created: day(2), desc: 'Boxed sets, never installed. Includes mounting frame and flush plate. Original cartons are intact.' },
  { id: 'p12', title: 'Sal wood door frames, 7×3 ft', cat: 'Doors & Windows', price: 3200, mrp: 4800, unit: 'piece', qty: 18, cond: 'Used, good condition', shelf: 'Not applicable', area: 'Hadapsar', seller: 'Patil Constructions', status: 'declared', created: day(10), desc: 'Taken out from a demolished block. Wood is sound with no termite damage observed. Needs light sanding.' },
  /* My Profile Listings */
  { id: 'm1', mine: 1, title: 'AAC blocks, 600×200×100 mm', cat: 'Bricks & Blocks', price: 52, mrp: 68, unit: 'piece', qty: 900, cond: 'New, unused', shelf: 'Not applicable', area: 'Chakan', seller: 'Your Business Profile', status: 'reviewed', created: day(3), desc: 'Covered and stacked on a levelled pad. Delivered on pallets if the buyer brings a truck.' },
  { id: 'm2', mine: 1, title: 'Aluminium sliding window frames, 4×4 ft', cat: 'Doors & Windows', price: 3600, mrp: 5200, unit: 'piece', qty: 14, cond: 'New, open box', shelf: 'Not applicable', area: 'Pimpri', seller: 'Your Business Profile', status: 'declared', created: day(5), desc: 'Powder-coated grey frames without glass. Three frames have light transit scratches.' },
  { id: 'm3', mine: 1, title: 'Laminate flooring planks, 8 mm', cat: 'Wood & Boards', price: 95, mrp: 140, unit: 'sq ft', qty: 300, cond: 'New, unused', shelf: 'Not applicable', area: 'Baner', seller: 'Your Business Profile', status: 'pending', created: day(0), desc: 'Oak finish click-lock planks, sealed packs. Submitted today and awaiting review.' }
];
const SEED_ENQ = [
  { id: 'e1', dir: 'in', listingId: 'm1', listingTitle: 'AAC blocks, 600×200×100 mm', buyer: 'Rohan K.', phone: '9822334401', qty: 400, message: 'Can you hold 400 blocks until Friday? I can bring a tempo.', status: 'new', created: day(1) },
  { id: 'e2', dir: 'in', listingId: 'm2', listingTitle: 'Aluminium sliding window frames, 4×4 ft', buyer: 'Meera S.', phone: '9822334402', qty: 6, message: 'Are the frames compatible with a 4 ft opening in a 9 inch wall?', status: 'new', created: day(2) },
  { id: 'e3', dir: 'in', listingId: 'm1', listingTitle: 'AAC blocks, 600×200×100 mm', buyer: 'Vikram P.', phone: '9822334403', qty: 200, message: 'Interested in 200 pieces. Is the price negotiable for pickup this weekend?', status: 'accepted', created: day(4) }
];

/* ---------- State Management ---------- */
const state = {
  listings: store.get('ss_listings_v2', null) || (store.set('ss_listings_v2', SEED), SEED),
  enquiries: store.get('ss_enquiries_v2', null) || (store.set('ss_enquiries_v2', SEED_ENQ), SEED_ENQ),
  saved: store.get('ss_saved_v2', []),
  homeCat: 'All',
  f: { q: '', cat: 'All', cond: 'Any', price: 'any', area: 'Any', reviewed: false, sort: 'relevance' },
  dash: 'overview',
  view: 'home'
};
const persist = () => { store.set('ss_listings_v2', state.listings); store.set('ss_enquiries_v2', state.enquiries); store.set('ss_saved_v2', state.saved); };
const byId = id => state.listings.find(l => l.id === id);
const lot = l => l.price * l.qty;
const savePct = l => l.mrp && l.mrp > l.price ? Math.round((1 - l.price / l.mrp) * 100) : 0;
const fmtDate = t => new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

/* ---------- SVGs / Visual Assets ---------- */
const BG = { Tiles: '#EFECE5', Cement: '#ECE9E2', Steel: '#E8E8E6', Plumbing: '#EEEBE4', Electrical: '#EDEBE6', Wood: '#EFEAE0', Paint: '#EFECE6', Bricks: '#EDE5DC', Doors: '#ECEAE5' };
const bag = (x, y) => `<g><rect x="${x}" y="${y}" width="150" height="88" rx="12" fill="#CFCABD"/><rect x="${x}" y="${y + 30}" width="150" height="26" fill="#F36B21"/><rect x="${x + 44}" y="${y + 36}" width="62" height="14" rx="3" fill="#fff" opacity=".9"/><path d="M${x + 8} ${y + 8}h134" stroke="#B9B3A5" stroke-width="3"/></g>`;
const PARTS = {
  Tiles: k => { let s = ''; const c = ['#D8D3C8', '#CCC6B8', '#E3DFD5', '#C4BDAE']; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { const x = 68 + i * 118, y = 52 + j * 118; s += `<rect x="${x}" y="${y}" width="110" height="110" rx="3" fill="${c[(i * 3 + j + k) % 4]}"/><path d="M${x + 14} ${y + 96}L${x + 96} ${y + 14}" stroke="#fff" stroke-opacity=".4" stroke-width="3"/>`; } return s; },
  Cement: () => bag(75, 300) + bag(225, 300) + bag(375, 300) + bag(150, 205) + bag(300, 205) + bag(225, 110),
  Steel: () => { let s = ''; for (let r = 0; r < 5; r++) { const n = r % 2 ? 6 : 7, off = r % 2 ? 78 : 52; for (let i = 0; i < n; i++) s += `<circle cx="${off + i * 78}" cy="${90 + r * 66}" r="30" fill="#4A4F57"/><circle cx="${off + i * 78}" cy="${90 + r * 66}" r="20" fill="none" stroke="#6E7580" stroke-width="3"/><circle cx="${off + i * 78}" cy="${90 + r * 66}" r="6" fill="#F36B21"/>`; } return s; },
  Plumbing: () => { let s = ''; [[70, 460], [90, 440], [60, 470], [100, 430]].forEach(([x, w], i) => { const y = 78 + i * 84; s += `<rect x="${x}" y="${y}" width="${w}" height="46" rx="23" fill="#fff" stroke="#D3CEC3" stroke-width="3"/><rect x="${x + 70}" y="${y}" width="16" height="46" fill="#F36B21"/><rect x="${x + w - 86}" y="${y}" width="16" height="46" fill="#F36B21"/>`; }); return s; },
  Electrical: () => `<g fill="none"><circle cx="205" cy="230" r="108" stroke="#25282C" stroke-width="44"/><circle cx="205" cy="230" r="108" stroke="#F36B21" stroke-width="6" stroke-dasharray="12 10"/><circle cx="395" cy="250" r="88" stroke="#3B4047" stroke-width="38"/><circle cx="395" cy="250" r="88" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-dasharray="10 12"/></g>`,
  Wood: () => { let s = ''; const c = ['#C9A47A', '#BE9768', '#D2AF88', '#B98F61', '#C6A073', '#D0AB82']; for (let i = 0; i < 6; i++) { const y = 62 + i * 58; s += `<rect x="${60 + (i % 2) * 14}" y="${y}" width="470" height="48" rx="4" fill="${c[i]}"/><path d="M${90 + (i % 2) * 14} ${y + 16}h360M${130 + (i % 3) * 20} ${y + 32}h300" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>`; } return s; },
  Paint: () => [90, 235, 380].map((x, i) => `<g><rect x="${x}" y="${170 + (i % 2) * 20}" width="130" height="170" rx="10" fill="#fff" stroke="#D3CEC3" stroke-width="3"/><rect x="${x}" y="${222 + (i % 2) * 20}" width="130" height="40" fill="#F36B21"/><ellipse cx="${x + 65}" cy="${170 + (i % 2) * 20}" rx="65" ry="14" fill="#E4E0D7" stroke="#D3CEC3" stroke-width="3"/><path d="M${x + 12} ${170 + (i % 2) * 20}Q${x + 65} ${95 + (i % 2) * 20} ${x + 118} ${170 + (i % 2) * 20}" fill="none" stroke="#8B9097" stroke-width="4"/></g>`).join(''),
  Bricks: k => { let s = ''; const c = ['#C4623A', '#B85630', '#CF7048', '#BC5B34']; for (let r = 0; r < 8; r++) { const off = r % 2 ? -50 : 0; for (let i = 0; i < 7; i++) s += `<rect x="${off + i * 106 + 14}" y="${28 + r * 52}" width="100" height="46" rx="3" fill="${c[(i + r * 2 + k) % 4]}"/>`; } return s; },
  Doors: () => `<rect x="150" y="50" width="300" height="350" rx="6" fill="#fff" stroke="#25282C" stroke-width="20"/><path d="M300 50V400M150 225H450" stroke="#25282C" stroke-width="12"/><rect x="170" y="70" width="120" height="145" fill="#DDE3E6" opacity=".7"/><path d="M175 205L285 80" stroke="#fff" stroke-width="8" opacity=".7"/><rect x="258" y="226" width="8" height="42" rx="4" fill="#F36B21"/>`
};
const svgUri = s => 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
function art(cat, seed = 0) {
  const k = CAT_ART[cat] || cat;
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450"><rect width="600" height="450" fill="${BG[k] || '#EEE'}"/>${(PARTS[k] || PARTS.Tiles)(seed)}</svg>`);
}
function heroArt() {
  const cells = [['Bricks', 0, 0], ['Tiles', 1, 0], ['Steel', 0, 1], ['Cement', 1, 1]];
  const g = cells.map(([k, c, r]) => `<svg x="${c * 404}" y="${r * 324}" width="396" height="316" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice"><rect width="600" height="450" fill="${BG[k]}"/>${PARTS[k](1)}</svg>`).join('');
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640"><rect width="800" height="640" fill="#fff"/>${g}</svg>`);
}
const imgOf = l => (l.imgs && l.imgs[0]) || art(l.cat, l.id.charCodeAt(l.id.length - 1));

/* ---------- Core UI Components ---------- */
const btn = (label, { v = 'secondary', icon = '', size = '', attrs = '', cls = '' } = {}) =>
  `<button type="button" class="btn btn-${v} ${size ? 'btn-' + size : ''} ${cls}" ${attrs}>${icon ? `<i data-lucide="${icon}" class="w-[18px] h-[18px] mr-1"></i>` : ''}${label}</button>`;
const linkBtn = (label, href, { v = 'secondary', icon = '', size = '', cls = '' } = {}) =>

function validate(form, rules) {

  Object.entries(rules).forEach(([id, fn]) => {

}

function resizeImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const s = Math.min(1, 800 / im.width), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .75)); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  const side = tabs.map(([k, i, l]) => `<button type="button" class="filter-opt gap-3 !justify-start whitespace-nowrap text-[15px] font-bold py-3 px-4 ${state.dash === k ? 'bg-ink text-white hover:bg-ink' : 'hover:bg-canvas text-muted hover:text-ink'}" aria-pressed="${state.dash === k}" data-action="dash-tab" data-tab="${k}"><i data-lucide="${i}" class="w-5 h-5 ${state.dash === k ? 'text-brand' : ''}"></i>${l}${k === 'enquiries' && inbound.some(e => e.status === 'new') ? `<span class="ml-auto badge bg-brand text-white h-5 px-2 rounded">${inbound.filter(e => e.status === 'new').length}</span>` : ''}</button>`).join('');
  const active = mine.filter(l => l.status !== 'pending');
  const listRow = l => `<div class="flex items-center gap-4 sm:gap-5 py-4 hover:bg-canvas/50 px-2 -mx-2 rounded-lg transition-colors"><img src="${imgOf(l)}" alt="" class="w-16 h-16 rounded-xl object-cover border border-line shadow-sm shrink-0"><div class="min-w-0 flex-1"><p class="text-[15px] font-bold text-ink truncate">${esc(l.title)}</p><p class="text-[13px] font-medium text-muted mt-1">${inr(l.price)} / ${esc(l.unit)} <span class="mx-1.5">•</span> ${l.qty.toLocaleString('en-IN')} available <span class="mx-1.5">•</span> ${esc(l.area)}</p></div><div class="hidden md:block">${statusBadge(l.status)}</div><div class="flex gap-2">${btn('', { v: 'secondary', size: 'sm', icon: 'eye', cls: 'bg-white shadow-sm', attrs: `data-action="open" data-id="${l.id}" aria-label="View listing"` })}${btn('', { v: 'secondary', size: 'sm', icon: 'trash-2', cls: 'text-danger bg-white shadow-sm hover:bg-danger-50 hover:border-danger hover:text-danger', attrs: `data-action="delete-listing" data-id="${l.id}" aria-label="Delete listing"` })}</div></div>`;
  const enqRow = (e, actions) => `<div class="py-5"><div class="flex items-start justify-between gap-4"><div class="min-w-0"><p class="text-[15px] font-bold text-ink">${esc(e.buyer)} <span class="text-muted font-medium ml-2 border-l border-line pl-2">${e.qty} requested</span></p><p class="text-[13px] font-medium text-muted mt-1 truncate">${esc(e.listingTitle)} <span class="mx-1.5">•</span> ${fmtDate(e.created)}</p></div><span class="badge ${e.status === 'accepted' ? 'bg-success-50 text-success' : e.status === 'rejected' ? 'bg-danger-50 text-danger' : 'bg-warning-50 text-warning'} capitalize px-3 py-1 text-[11px]">${e.status === 'new' && e.dir === 'out' ? 'Sent' : e.status}</span></div><div class="mt-3 bg-canvas p-3 rounded-lg border border-line text-[14px] text-ink font-medium leading-relaxed">${esc(e.message || 'No message provided.')}</div>${actions && e.status === 'new' ? `<div class="mt-4 flex gap-3">${btn('Accept Request', { v: 'primary', size: 'sm', icon: 'check', cls: 'shadow-sm', attrs: `data-action="enq-accept" data-id="${e.id}"` })}${btn('Decline', { v: 'danger', size: 'sm', icon: 'x', cls: 'shadow-sm', attrs: `data-action="enq-reject" data-id="${e.id}"` })}</div>` : ''}</div>`;
  let content = '';
  if (state.dash === 'overview') {
    const potential = active.reduce((s, l) => s + lot(l) * (1 - COMMISSION), 0);
    content = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">${statCard('Active Listings', active.length, 'boxes')}${statCard('Pending Review', mine.length - active.length, 'clock')}${statCard('New Enquiries', inbound.filter(e => e.status === 'new').length, 'inbox')}${statCard('Potential Net', inr(potential), 'indian-rupee')}</div>
      <div class="mt-8 grid xl:grid-cols-2 gap-6"><div class="card p-6"><div class="flex items-center justify-between border-b border-line pb-4 mb-2"><h2 class="text-lg font-bold text-ink">Recent Enquiries</h2>${btn('View All', { v: 'tertiary', size: 'sm', cls: 'font-bold text-brand', attrs: 'data-action="dash-tab" data-tab="enquiries"' })}</div><div class="divide-y divide-line">${inbound.length ? inbound.slice(0, 2).map(e => enqRow(e, true)).join('') : '<div class="py-8 text-center text-[15px] font-medium text-muted bg-canvas rounded-lg mt-4 border border-dashed border-line">No enquiries received yet.</div>'}</div></div>
      <div class="card p-6"><div class="flex items-center justify-between border-b border-line pb-4 mb-2"><h2 class="text-lg font-bold text-ink">Your Listings</h2>${btn('Manage', { v: 'tertiary', size: 'sm', cls: 'font-bold text-brand', attrs: 'data-action="dash-tab" data-tab="listings"' })}</div><div class="divide-y divide-line">${mine.length ? mine.slice(0, 3).map(listRow).join('') : '<div class="py-8 text-center text-[15px] font-medium text-muted bg-canvas rounded-lg mt-4 border border-dashed border-line">No active listings yet.</div>'}</div></div></div>`;
  } else if (state.dash === 'listings') {
    content = `<div class="card p-6 shadow-sm"><div class="flex items-center justify-between border-b border-line pb-4 mb-2"><h2 class="text-lg font-bold text-ink">My Listings</h2><span class="text-[13px] font-bold text-muted bg-canvas px-3 py-1 rounded-full border border-line">${mine.length} Total</span></div>${mine.length ? `<div class="divide-y divide-line">${mine.map(listRow).join('')}</div>` : emptyState('boxes', 'No listings created', 'List your first batch of surplus material to start receiving enquiries.', linkBtn('List Surplus', '#/sell', { v: 'primary' }))}</div>`;
  } else {
    content = `<div class="card p-6 shadow-sm"><h2 class="text-lg font-bold text-ink border-b border-line pb-4 mb-2">Received Inquiries</h2><div class="divide-y divide-line">${inbound.length ? inbound.map(e => enqRow(e, true)).join('') : '<div class="py-10 text-center text-[15px] font-medium text-muted">No enquiries received yet.</div>'}</div></div>
      <div class="card p-6 shadow-sm mt-6"><h2 class="text-lg font-bold text-ink border-b border-line pb-4 mb-2">Sent Inquiries</h2><div class="divide-y divide-line">${sent.length ? sent.map(e => enqRow(e, false)).join('') : '<div class="py-10 text-center text-[15px] font-medium text-muted">Enquiries you initiate from the marketplace will appear here.</div>'}</div></div>`;
  }
  return `<section class="wrap py-8 lg:py-12"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-5 mb-8"><div><h1 class="text-3xl lg:text-4xl font-extrabold tracking-tight text-ink">Seller Dashboard</h1><p class="mt-2 text-lg font-medium text-muted">Manage your listings, enquiries, and account performance.</p></div>${linkBtn('New Listing', '#/sell', { v: 'primary', icon: 'plus', cls: 'shadow-md w-full sm:w-auto' })}</div>
    <div class="lg:grid lg:grid-cols-[240px_1fr] gap-8 items-start"><nav class="card p-2.5 flex lg:flex-col gap-1.5 overflow-x-auto no-scrollbar mb-6 lg:mb-0 lg:sticky lg:top-28 shadow-sm" aria-label="Dashboard Menu">${side}</nav><div class="min-w-0">${content}</div></div></section>`;
}

/* ---------- Routing Engine ---------- */
function route() {
  closeFilters(); while (modals.length) closeModal();
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const view = h === 'marketplace' || h === 'sell' || h === 'dashboard' ? h : 'home';
  state.view = view;
  const app = $('#app');
  app.innerHTML = { home: viewHome, marketplace: viewMarket, sell: viewSell, dashboard: viewDash }[view]();
  if (view === 'home') renderHomeFeatured();
  if (view === 'marketplace') updateMarket();
  if (view === 'sell') { sellPhotos = []; }
  renderNav(); icons();
  const target = h === 'how' || h === 'sustainability' ? $('#' + h) : null;
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  document.title = ({ home: 'SurplusSetu — Sustainable Construction Materials', marketplace: 'Marketplace — SurplusSetu', sell: 'List Surplus — SurplusSetu', dashboard: 'Dashboard — SurplusSetu' })[view];
}
function refreshViews() {
  if (state.view === 'home') renderHomeFeatured(); else if (state.view === 'marketplace') updateMarket(); else if (state.view === 'dashboard') { $('#app').innerHTML = viewDash(); icons(); }
}

/* ---------- Event Listeners & Actions ---------- */
const actions = {
  'nav-toggle'(el) { const m = $('#mobile-menu'), open = m.classList.toggle('hidden') === false; el.setAttribute('aria-expanded', open); el.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); },
  open(el) { const p = byId(el.dataset.id); if (!p) return; lastProductModal = p.id; if (modals.length) setModalBody(productModalBody(p), 'Material Details'); else openModal({ title: 'Material Details', size: 'max-w-xl', body: productModalBody(p) }); },
  save(el) {
    const id = el.dataset.id, i = state.saved.indexOf(id);
    if (i > -1) { state.saved.splice(i, 1); toast('Removed from saved listings', 'info'); } else { state.saved.push(id); toast('Listing saved to your profile.'); }
    persist(); refreshViews();
    if (modals.length && lastProductModal === id) setModalBody(productModalBody(byId(id)));
  },
  'close-modal'() { closeModal(); },
  'confirm-yes'() { const cb = confirmCb; confirmCb = null; closeModal(); cb && cb(); },
  enquire(el) { const p = byId(el.dataset.id); setModalBody(enquiryBody(p), 'Contact Seller'); },
  login() { openModal({ title: 'Account Login', size: 'max-w-md', body: `<form data-form="login" novalidate class="space-y-5">${field({ id: 'l-email', label: 'Email Address', type: 'email', req: true, attrs: 'autocomplete="email"' })}${field({ id: 'l-pass', label: 'Password', type: 'password', req: true, attrs: 'autocomplete="current-password"' })}<button type="submit" class="btn btn-primary w-full btn-lg shadow-md mt-2">Log in securely</button></form>` }); },
  'home-cat'(el) { state.homeCat = el.dataset.cat; renderHomeFeatured(); },
  'set-filter'(el) { state.f[el.dataset.key] = el.dataset.val; updateMarket(); },
  'clear-one'(el) { const k = el.dataset.key; state.f[k] = { q: '', cond: 'Any', price: 'any', area: 'Any', reviewed: false }[k]; if (k === 'q') $('#mk-q').value = ''; updateMarket(); },
  'clear-filters'() { Object.assign(state.f, { q: '', cat: 'All', cond: 'Any', price: 'any', area: 'Any', reviewed: false }); const q = $('#mk-q'); if (q) q.value = ''; updateMarket(); },
  'open-filters'() { openFilters(); },
  'close-filters'() { closeFilters(); },
  'goto-cat'(el) { state.f.cat = el.dataset.cat; if (state.view === 'marketplace') updateMarket(); },
  'dash-tab'(el) { state.dash = el.dataset.tab; $('#app').innerHTML = viewDash(); icons(); },
  'delete-listing'(el) { const l = byId(el.dataset.id); confirmDialog({ title: 'Delete this listing?', text: `“${esc(l.title)}” will be permanently removed from the marketplace. This action cannot be undone.`, label: 'Delete Listing', onConfirm() { state.listings = state.listings.filter(x => x.id !== l.id); persist(); refreshViews(); toast('Listing deleted successfully.'); } }); },
  'enq-accept'(el) { const e = state.enquiries.find(x => x.id === el.dataset.id); e.status = 'accepted'; persist(); refreshViews(); toast('Enquiry accepted. Buyer contact information shared.'); },
  'enq-reject'(el) { const e = state.enquiries.find(x => x.id === el.dataset.id); confirmDialog({ title: 'Decline this enquiry?', text: `${esc(e.buyer)} will be notified that the material is unavailable for their request.`, label: 'Decline Enquiry', onConfirm() { e.status = 'rejected'; persist(); refreshViews(); toast('Enquiry declined.', 'info'); } }); },
  'remove-photo'(el) { sellPhotos.splice(+el.dataset.i, 1); renderPhotos(); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-action]'); if (!t) return; const a = actions[t.dataset.action]; if (a) { if (t.tagName === 'A' && t.dataset.action !== 'goto-cat') e.preventDefault(); a(t, e); } });
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (k === 'q') { state.f.q = e.target.value; updateMarket(); }
  if (e.target.form && e.target.form.dataset.form === 'sell') { updatePayout(); e.target.removeAttribute('aria-invalid'); const o = $(`[data-err="${e.target.id}"]`, e.target.form); if (o) o.classList.add('hidden'); }
});
document.addEventListener('change', async e => {
  const k = e.target.dataset.input;
  if (k === 'sort') { state.f.sort = e.target.value; updateMarket(); }
  if (k === 'reviewed') { state.f.reviewed = e.target.checked; updateMarket(); }
  if (k === 'photos') {
    const err = $('[data-err="photos"]'); err.classList.add('hidden');
    for (const f of [...e.target.files]) { if (sellPhotos.length >= 3) { err.textContent = 'A maximum of 3 photos is allowed.'; err.classList.remove('hidden'); break; } if (!f.type.startsWith('image/')) { err.textContent = 'Only image files are supported.'; err.classList.remove('hidden'); continue; } try { sellPhotos.push(await resizeImage(f)); } catch (x) { err.textContent = 'Image error. Please try a different file.'; err.classList.remove('hidden'); } }
    e.target.value = ''; renderPhotos();
  }
});
document.addEventListener('submit', e => {
  const form = e.target, kind = form.dataset.form; if (!kind) return; e.preventDefault();
  if (kind === 'login') {
    if (!validate(form, { 'l-email': v => emailRule(v), 'l-pass': v => v.length >= 6 ? '' : 'Password must be at least 6 characters.' })) return;
    closeModal(); toast('Signed in successfully.');
  }
  if (kind === 'enquiry') {
    const p = byId(form.dataset.id);
    if (!validate(form, { 'en-name': need('Please enter your full name.'), 'en-phone': phoneRule, 'en-qty': v => (+v >= 1 && +v <= p.qty) ? '' : `Enter a quantity between 1 and ${p.qty}.` })) return;
    state.enquiries.unshift({ id: 'e' + Date.now(), dir: 'out', listingId: p.id, listingTitle: p.title, buyer: form['en-name'].value.trim(), phone: form['en-phone'].value.trim(), qty: +form['en-qty'].value, message: form['en-msg'].value.trim(), status: 'new', created: Date.now() });
    persist(); closeModal(); toast('Enquiry submitted. Monitor status in your Dashboard.');
  }
  if (kind === 'sell') {
    const r = {
      title: v => v.length >= 5 ? '' : 'Provide a descriptive title (min 5 characters).', cat: need('Please select a category.'), desc: v => v.length >= 20 ? '' : 'Provide a detailed description (min 20 characters).',
      price: v => +v > 0 ? '' : 'Price must be greater than ₹0.', unit: need('Select a unit of measurement.'), qty: v => +v >= 1 ? '' : 'Quantity must be at least 1.',
      mrp: v => !v || +v > +form.price.value ? '' : 'Market price should be higher than your asking price.',
      cond: need('Select the material condition.'), shelf: need('Select remaining shelf life.'), area: need('Select a pickup location.'),
      sname: need('Enter business or contact name.'), sphone: phoneRule, semail: emailRule, consent: v => v ? '' : 'You must accept the terms to continue.'
    };
    if (!validate(form, r)) { toast('Please correct the highlighted fields.', 'error'); return; }
    const listing = { id: 'm' + Date.now(), mine: 1, title: form.elements.title.value.trim(), cat: form.cat.value, price: +form.price.value, mrp: +form.mrp.value || 0, unit: form.unit.value, qty: +form.qty.value, cond: form.cond.value, shelf: form.shelf.value, area: form.area.value, seller: 'Your Business Profile', status: 'pending', created: Date.now(), desc: form.desc.value.trim(), imgs: sellPhotos.slice() };
    state.listings.unshift(listing);
    if (!store.set('ss_listings_v2', state.listings)) { state.listings[0].imgs = []; persist(); toast('Storage limit reached; listing saved without images.', 'info'); }
    state.dash = 'listings'; toast('Listing submitted successfully for review.'); location.hash = '#/dashboard';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modals.length) { closeModal(); } else if ($('#drawer-root').firstChild) closeFilters(); else { const m = $('#mobile-menu'); if (m && !m.classList.contains('hidden')) { m.classList.add('hidden'); } } }
  if (e.key === 'Tab') {
    const dlg = modals.length ? $('[role=dialog]', modals[modals.length - 1]) :$('#drawer-root [role=dialog]');
    if (!dlg) return; const f = focusables(dlg); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } else if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
});
window.addEventListener('hashchange', route);
renderFooter();
route();
</script>
</body>
</html>
